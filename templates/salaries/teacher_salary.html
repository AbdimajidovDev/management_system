<h2>Oylik Hisoboti</h2>

<form method="get">
  <label>Guruh:</label>
  <select name="group">
    {% for g in groups %}
      <option value="{{ g.id }}" {% if g.id == group.id %}selected{% endif %}>{{ g.name }}</option>
    {% endfor %}
  </select>

  <label>Oy:</label>
  <input type="number" name="month" value="{{ month }}" min="1" max="12">
  <label>Yil:</label>
  <input type="number" name="year" value="{{ year }}">
  <button type="submit">Hisobla</button>
</form>

{% if salary %}
  <p><strong>Oylik:</strong> {{ salary }} so‘m</p>
{% endif %}
